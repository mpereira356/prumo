<p>Quantidade disponível: <strong>{{ asset.qtd }}</strong></p><p class="footnote">Registre o preço efetivamente recebido por unidade. O resgate reduz a posição e devolve o dinheiro à Carteira; não representa uma ordem enviada à corretora.</p><form method="post" action="{{ url_for('sell_asset',asset_id=asset.id) }}" data-confirm="Confirmar o resgate e adicionar o valor recebido à Carteira?">{{ csrf() }}{% if in_modal %}<input type="hidden" name="modal" value="1">{% endif %}<div class="form-grid"><label>Quantidade resgatada<input type="number" name="qtd" value="{{ modal_values.get('qtd','') if modal_values and modal_error=='asset-sell-'~asset.id else '' }}" min="0.000001" max="{{ asset.qtd }}" step="any" required></label><label>Valor recebido por unidade (R$)<input type="number" name="preco" min="0.01" max="100000000000" step="0.01" value="{{ modal_values.get('preco',asset.atual) if modal_values and modal_error=='asset-sell-'~asset.id else asset.atual }}" required></label></div><div class="form-actions">{% if in_modal %}<button type="button" class="button" data-dialog-cancel>Cancelar</button>{% else %}<a class="button" href="{{ url_for('portfolio') }}">Cancelar</a>{% endif %}<button class="button primary">Registrar resgate</button></div></form>
