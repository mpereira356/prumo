{% extends 'base.html' %}{% from '_components.html' import page_heading with context %}{% block content %}{{ page_heading('RECEBÍVEIS','Novo contrato','Defina as condições para gerar o cronograma de recebimentos.') }}<section class="panel form-panel"><form method="post">{{ csrf() }}<div class="form-grid"><label>Tomador / nome<input name="tomador" maxlength="150" value="{{ request.form.get('tomador','') }}" required></label><label>Modalidade<select name="tipo" id="contract-type">{% for key,label in types.items() %}<option value="{{ key }}" {{ 'selected' if request.form.get('tipo')==key }}>{{ label }}</option>{% endfor %}</select></label><label>Principal (R$)<input name="principal" type="number" step="0.01" min="0" value="{{ request.form.get('principal','0') }}" required></label><label>Valor da parcela (R$)<input name="valorMensal" type="number" step="0.01" min="0" value="{{ request.form.get('valorMensal','0') }}" required><small>Para juros e amortização, calculado pela taxa.</small></label><label>Primeiro vencimento<input type="date" name="inicio" value="{{ request.form.get('inicio',today) }}" required></label><label>Número de parcelas<input type="number" name="parcelas" min="1" max="480" value="{{ request.form.get('parcelas','1') }}" required></label><label>Taxa mensal (%)<input name="taxa" type="number" step="0.01" min="0" max="100" value="{{ request.form.get('taxa','0') }}"><small>Aplicada a juros com amortização.</small></label><label>Risco informado<select name="risco">{% for risk in ['baixo','medio','alto'] %}<option value="{{ risk }}" {{ 'selected' if request.form.get('risco','medio')==risk }}>{{ risk|capitalize }}</option>{% endfor %}</select></label><label class="wide" id="cheque-field">Cheques: uma linha por vencimento e valor<textarea name="cheques" rows="4" placeholder="2026-12-10;15000.00">{{ request.form.get('cheques','') }}</textarea><small>Formato AAAA-MM-DD;valor. Obrigatório na modalidade Cheques.</small></label><label class="wide">Observações<textarea name="obs" maxlength="1000" rows="3">{{ request.form.get('obs','') }}</textarea></label></div><div class="form-actions"><a class="button" href="{{ url_for('receivables') }}">Cancelar</a><button class="button primary">Criar contrato</button></div></form></section>{% endblock %}
