{% extends 'base.html' %}{% from '_components.html' import page_heading with context %}{% block content %}{{ page_heading('CARTEIRA',title,'Registre a posição e mantenha seus totais atualizados.') }}<section class="panel form-panel"><form method="post">{{ csrf() }}<div class="form-grid"><label>Ticker ou identificador<input name="ticker" maxlength="80" required value="{{ asset.get('ticker','') }}"></label><label>Nome do ativo<input name="nome" maxlength="80" required value="{{ asset.get('nome','') }}"></label><label>Classe<select name="classe">{% for key,label in classes.items() %}<option value="{{ key }}" {{ 'selected' if asset.get('classe')==key }}>{{ label }}</option>{% endfor %}</select></label><label>Quantidade<input type="number" step="any" min="0.000001" max="100000000000" name="qtd" required value="{{ asset.get('qtd','') }}"></label><label>Preço médio (R$)<input type="number" step="0.01" min="0" max="100000000000" name="pm" required value="{{ asset.get('pm','') }}"></label><label>Preço atual de referência (R$)<input type="number" step="0.01" min="0" max="100000000000" name="atual" required value="{{ asset.get('atual','') }}"></label></div><div class="form-actions"><a class="button" href="{{ url_for('portfolio') }}">Cancelar</a><button class="button primary">Salvar posição</button></div></form>{% if asset.get('id') %}<form method="post" action="{{ url_for('delete_asset',asset_id=asset.id) }}" class="danger-zone" data-confirm="Excluir esta posição da carteira? Exporte um backup antes se precisar recuperá-la.">{{ csrf() }}<button class="text-button negative">Excluir posição</button></form>{% endif %}</section>{% endblock %}
